<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">Peyman Salimi — AI Engineer, Software Engineer, Mathematical Researcher</title>
  <desc id="desc">Animated abstract map connecting mathematical reasoning, machine learning, intelligent systems and software engineering.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="0.55" stop-color="#111827"/>
      <stop offset="1" stop-color="#0b1224"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#67e8f9"/>
      <stop offset="0.5" stop-color="#60a5fa"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#67e8f9" stop-opacity=".28"/>
      <stop offset="1" stop-color="#67e8f9" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="28"/></filter>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#94a3b8" stroke-opacity=".07"/>
    </pattern>
  </defs>

  <rect width="1200" height="420" rx="28" fill="url(#bg)"/>
  <rect width="1200" height="420" rx="28" fill="url(#grid)"/>
  <circle cx="980" cy="80" r="180" fill="url(#glow)" filter="url(#blur)">
    <animate attributeName="cx" values="980;1040;980" dur="8s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="80;130;80" dur="8s" repeatCount="indefinite"/>
  </circle>

  <g transform="translate(72 64)" font-family="Inter,Segoe UI,Arial,sans-serif">
    <text x="0" y="22" fill="#67e8f9" font-size="14" font-weight="700" letter-spacing="3">PEYMAN SALIMI</text>
    <text x="0" y="78" fill="#f8fafc" font-size="42" font-weight="700">AI Engineer</text>
    <text x="0" y="126" fill="#cbd5e1" font-size="22">Software Engineering · Mathematical Research</text>

    <text x="0" y="178" fill="#94a3b8" font-size="17">Turning difficult problems into models, algorithms, intelligent systems,</text>
    <text x="0" y="204" fill="#94a3b8" font-size="17">and measurable outcomes.</text>

    <g transform="translate(0 250)">
      <rect x="0" y="0" width="130" height="34" rx="17" fill="#0f172a" stroke="#334155"/>
      <text x="65" y="22" fill="#cbd5e1" text-anchor="middle" font-size="13" font-weight="600">AI SYSTEMS</text>
      <rect x="142" y="0" width="146" height="34" rx="17" fill="#0f172a" stroke="#334155"/>
      <text x="215" y="22" fill="#cbd5e1" text-anchor="middle" font-size="13" font-weight="600">OPTIMIZATION</text>
      <rect x="300" y="0" width="122" height="34" rx="17" fill="#0f172a" stroke="#334155"/>
      <text x="361" y="22" fill="#cbd5e1" text-anchor="middle" font-size="13" font-weight="600">RAG / LLM</text>
      <rect x="434" y="0" width="136" height="34" rx="17" fill="#0f172a" stroke="#334155"/>
      <text x="502" y="22" fill="#cbd5e1" text-anchor="middle" font-size="13" font-weight="600">ALGORITHMS</text>
    </g>
  </g>

  <g transform="translate(760 78)">
    <path d="M80 82 L210 25 L330 92 L235 205 L95 190 Z" fill="none" stroke="#334155" stroke-width="2"/>
    <path d="M80 82 L235 205 M210 25 L95 190 M330 92 L95 190" fill="none" stroke="#334155" stroke-width="1.5"/>
    <path d="M80 82 L210 25 L330 92" fill="none" stroke="url(#accent)" stroke-width="2.5" stroke-dasharray="9 11">
      <animate attributeName="stroke-dashoffset" from="0" to="-40" dur="2s" repeatCount="indefinite"/>
    </path>
    <g fill="#0f172a" stroke="#67e8f9" stroke-width="2">
      <circle cx="80" cy="82" r="9"><animate attributeName="r" values="9;12;9" dur="2.8s" repeatCount="indefinite"/></circle>
      <circle cx="210" cy="25" r="9"><animate attributeName="r" values="9;12;9" dur="2.2s" repeatCount="indefinite"/></circle>
      <circle cx="330" cy="92" r="9"><animate attributeName="r" values="9;12;9" dur="3.1s" repeatCount="indefinite"/></circle>
      <circle cx="235" cy="205" r="9"><animate attributeName="r" values="9;12;9" dur="2.5s" repeatCount="indefinite"/></circle>
      <circle cx="95" cy="190" r="9"><animate attributeName="r" values="9;12;9" dur="2.9s" repeatCount="indefinite"/></circle>
    </g>
    <g font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="600">
      <text x="30" y="58" fill="#cbd5e1">MODEL</text>
      <text x="180" y="8" fill="#cbd5e1">ALGORITHM</text>
      <text x="342" y="98" fill="#cbd5e1">EVIDENCE</text>
      <text x="250" y="231" fill="#cbd5e1">DECISION</text>
      <text x="25" y="218" fill="#cbd5e1">SYSTEM</text>
    </g>
    <circle cx="208" cy="113" r="58" fill="url(#glow)">
      <animate attributeName="r" values="48;64;48" dur="4s" repeatCount="indefinite"/>
    </circle>
    <text x="208" y="110" fill="#f8fafc" text-anchor="middle" font-size="18" font-weight="700">Problem</text>
    <text x="208" y="136" fill="#67e8f9" text-anchor="middle" font-size="15" font-weight="600">→ measurable outcome</text>
  </g>

  <path d="M70 374 H1130" stroke="#334155"/>
  <rect x="70" y="373" width="190" height="2" fill="url(#accent)">
    <animate attributeName="x" values="70;940;70" dur="7s" repeatCount="indefinite"/>
  </rect>
  <text x="1130" y="397" fill="#64748b" text-anchor="end" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12">research · engineering · intelligent systems</text>
</svg>